<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rides dashboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Rides dashboard</h1>
    <nav><a href="./index.html">Home</a></nav>
  </header>
  <main>
    <p>Starting point for the agentic SDLC lab. Daily ride counts for three cities, July to September 2026, loaded from <code>data/rides.csv</code>.</p>
    <p id="total" aria-live="polite">Loading data&hellip;</p>
    <section>
      <h2>Rides by city</h2>
      <table id="by-city">
        <thead><tr><th>City</th><th>Rides</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="chart" class="bars" role="img" aria-label="Bar chart of rides by city"></div>
    </section>
    <section>
      <h2>Daily total</h2>
      <svg id="daily-chart" class="line-chart" role="img">
        <line id="daily-y-axis" class="axis"></line>
        <line id="daily-x-axis" class="axis"></line>
        <g id="daily-months"></g>
        <polyline id="daily-line"></polyline>
        <text id="daily-max" text-anchor="end"></text>
        <text id="daily-min" text-anchor="end"></text>
        <text id="daily-y-title" class="axis-title" text-anchor="middle">Daily total (rides)</text>
        <text id="daily-x-title" class="axis-title" text-anchor="middle">Date</text>
      </svg>
    </section>
  </main>
  <script type="module">
    import { parseCsv } from "./src/csv.js";
    import { totalRides, ridesByCity, dailyTotals } from "./src/stats.js";
    import { linePoints, monthTicks } from "./src/chart.js";

    const response = await fetch("./data/rides.csv");
    const rows = parseCsv(await response.text());
    const byCity = ridesByCity(rows);

    document.getElementById("total").textContent =
      `Total rides: ${totalRides(rows).toLocaleString()}`;

    const tbody = document.querySelector("#by-city tbody");
    const chart = document.getElementById("chart");
    const max = Math.max(...byCity.map((d) => d.rides));
    for (const { city, rides } of byCity) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${city}</td><td>${rides.toLocaleString()}</td>`;
      tbody.appendChild(tr);

      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.width = `${(rides / max) * 100}%`;
      bar.textContent = `${city} ${rides.toLocaleString()}`;
      chart.appendChild(bar);
    }

    // Daily total chart layout, in viewBox units: the plot sits inside the
    // padding, which holds the axis labels and titles.
    const width = 600;
    const height = 230;
    const pad = { top: 10, right: 10, bottom: 45, left: 64 };
    const plotWidth = width - pad.left - pad.right;
    const plotHeight = height - pad.top - pad.bottom;

    const totals = dailyTotals(rows);
    const geometry = linePoints(totals.map((day) => day.rides), plotWidth, plotHeight);
    const plotBottom = pad.top + plotHeight;
    const first = totals[0].date;
    const last = totals[totals.length - 1].date;

    const svg = document.getElementById("daily-chart");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute(
      "aria-label",
      `Line chart of daily total rides from ${first} to ${last}, ranging from ${geometry.min.toLocaleString()} to ${geometry.max.toLocaleString()}.`,
    );

    const polyline = document.getElementById("daily-line");
    polyline.setAttribute("transform", `translate(${pad.left} ${pad.top})`);
    polyline.setAttribute("points", geometry.points);

    const place = (el, attributes) => {
      for (const [name, value] of Object.entries(attributes)) el.setAttribute(name, value);
      return el;
    };
    const byId = (id) => document.getElementById(id);
    const svgElement = (name) => document.createElementNS("http://www.w3.org/2000/svg", name);

    place(byId("daily-y-axis"), { x1: pad.left, y1: pad.top, x2: pad.left, y2: plotBottom });
    place(byId("daily-x-axis"), { x1: pad.left, y1: plotBottom, x2: width - pad.right, y2: plotBottom });

    byId("daily-max").textContent = geometry.max.toLocaleString();
    place(byId("daily-max"), { x: pad.left - 6, y: pad.top + 4 });
    byId("daily-min").textContent = geometry.min.toLocaleString();
    place(byId("daily-min"), { x: pad.left - 6, y: plotBottom + 4 });

    const titleX = 14;
    const titleY = pad.top + plotHeight / 2;
    place(byId("daily-y-title"), { x: titleX, y: titleY, transform: `rotate(-90 ${titleX} ${titleY})` });
    place(byId("daily-x-title"), { x: pad.left + plotWidth / 2, y: height - 6 });

    const months = byId("daily-months");
    for (const { x, label } of monthTicks(totals.map((day) => day.date), plotWidth)) {
      const tickX = pad.left + x;
      months.append(
        place(svgElement("line"), { class: "axis", x1: tickX, y1: plotBottom, x2: tickX, y2: plotBottom + 5 }),
        Object.assign(place(svgElement("text"), { x: tickX, y: plotBottom + 18, "text-anchor": "middle" }), {
          textContent: label,
        }),
      );
    }
  </script>
</body>
</html>
